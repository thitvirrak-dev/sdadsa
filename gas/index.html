<style>
/* Heritage Operations: hospitality editorial, deep navy + Brass Ledger, Khmer-first type, ruled surfaces, restrained motion. */
:root {
  --navy: #0b2742;
  --navy-2: #123955;
  --navy-3: #1b4a69;
  --brass: #b68a45;
  --brass-light: #d2ad6f;

  --ink: #1a2935;

  --danger: #a64e4d;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --shadow-soft: 0 10px 32px rgba(11, 39, 66, .07);

  --font-khmer: "Noto Sans Khmer", "Khmer OS", system-ui, sans-serif;
  --font-sans: "DM Sans", system-ui, sans-serif;
  font-family: var(--font-sans);
  color: var(--ink);
  background: var(--fog);
  font-synthesis: none;
  text-rendering: optimizeLegibility;

* { box-sizing: border-box; }

.trend { position: absolute; right: 12px; top: 15px; display: flex; align-items: center; gap: 2px; color: var(--success); font: 700 10px var(--font-sans); }
.trend-down { color: var(--warning); }
.content-grid { display: grid; grid-template-columns: minmax(0, 1.62fr) minmax(280px, .98fr); gap: 15px; }
.panel { min-width: 0; background: white; border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow-card); }

.chart-panel { min-height: 316px; }

.alert-list { display: flex; flex-direction: column; padding: 2px 18px 13px; }

.alert-icon { width: 31px; height: 31px; flex: 0 0 31px; display: grid; place-items: center; border-radius: 9px; }

.section-intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }

.toolbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.primary-button, .secondary-button { min-height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 13px; border-radius: 8px; font-size: 11px; font-weight: 700; transition: transform .16s var(--ease-out), background .18s ease, box-shadow .18s ease, color .18s ease; }

.toolbar-strip { display: flex; justify-content: space-between; align-items: center; gap: 15px; padding: 11px 13px; margin-bottom: 17px; background: #edf2f2; border: 1px solid #e1e8e9; border-radius: 9px; }
.toolbar-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }.toolbar-group select { width: auto; min-width: 138px; }

/* ============================= google.script.run bridge ============================= */

function api(name, arg) {
  return new Promise(function (resolve, reject) {
    try {
      google.script.run
        .withSuccessHandler(function (r) { resolve(r); })
        .withFailureHandler(function (err) {
          var msg = err && err.message ? String(err.message) : String(err);
          reject(new Error(msg));
        })[name](arg);
    } catch (e) { reject(e); }
  });
}

function toast(type, message) {
  var region = document.querySelector('.toast-region');
  if (!region) {
    region = document.createElement('div');
    region.className = 'toast-region';
    document.body.appendChild(region);
  }
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = icon(type === 'success' ? 'check-circle' : type === 'error' ? 'alert-triangle' : 'bell', 15, 2) + '<span>' + esc(message) + '</span>';
  region.appendChild(el);
  window.setTimeout(function () {
    el.style.transition = 'opacity .3s ease, transform .3s ease';
    el.style.opacity = '0';
    el.style.transform = 'translateY(-4px)';
    window.setTimeout(function () { el.remove(); }, 320);
  }, 3200);
}
function toastSuccess(m) { toast('success', m); }
function toastError(m) { toast('error', m); }
function toastInfo(m) { toast('info', m); }

function errText(e) {
  var m = String(e && e.message ? e.message : e);
  if (m.indexOf('FDR:invalid') !== -1) return L('អ៊ីមែល ឬពាក្យសម្ងាត់មិនត្រឹមត្រូវ', 'That email or password doesn\'t match our records');
  if (m.indexOf('FDR:pending') !== -1) return L('គណនីរង់ចាំការអនុម័តពី Admin', 'This account is waiting for admin approval');
  if (m.indexOf('FDR:rejected') !== -1) return L('គណនីនេះមិនត្រូវបានអនុម័ត', 'This account was not approved');
  if (m.indexOf('FDR:unauthorized') !== -1) return L('សំណាកប្រើប្រាស់បានផុតកំណត់ — សូមចូលម្តងទៀត', 'Your session expired — please sign in again');
  return m;
}

/* ============================= data actions ============================= */

function loadState() {
  return api('getState', { token: S.token }).then(function (state) {
    S.data = state;
  });
}

function mutate(fn) {
  S.busy = true;
  render();
  return fn().then(function (r) {
    S.busy = false;
    return loadState().then(function () { S.busy = false; render(); return r; });
  }).catch(function (e) {
    S.busy = false;
    render();
    throw e;
  });
}

function doLogin(email, password) {
  return api('login', { email: email, password: password }).then(function (r) {
    S.token = r.token;
    S.user = r.user;
    try { localStorage.setItem('fdr_token', r.token); } catch (e) {}
    S.view = 'dashboard';
    return loadState().then(function () {
      S.busy = false;
      S.boot = false;
      render();
      toastSuccess(L('សូមស្វាគមន៍មកកាន់ FDR', 'Welcome to FDR'));
    });
  }).catch(function (e) {
    toastError(errText(e));
    throw e;
  });
}

function doRegister(payload) {
  return api('register', payload).then(function () {
    S.busy = false;
    S.registering = false;
    render();
    toastSuccess(L('សំណើចុះឈ្មោះបានផ្ញើទៅ Admin', 'Registration request sent to admin'));
  }).catch(function (e) {
    S.busy = false;
    S.registering = false;
    render();
    toastError(errText(e));
  });
}

function doLogout() {
  var token = S.token;
  api('logout', { token: token })['catch'](function () {});
  S.token = '';
  S.user = null;
  S.data = { tasks: [], reports: [], inquiries: [], feedback: [], finance: [], audit: [], users: [], pendingUsers: [] };
  try { localStorage.removeItem('fdr_token'); } catch (e) {}
  S.boot = false;
  render();
}

function doRefresh() {
  S.refreshing = true;
  render();
  loadState().then(function () {
    S.refreshing = false;
    render();
    toastSuccess(t().refreshed);
  }).catch(function () {
    S.refreshing = false;
    render();
    toastError(L('មិនអាចធ្វើបច្ចុប្បន្នភាពបាន', 'Refresh failed'));
  });
}

/* ============================= CSV + print ============================= */

function csvCell(value) {
  return '"' + String(value === null || value === undefined ? '' : value).split('\\').join('\\\\').split('"').join('""') + '"';
}
function downloadCsv(filename, headers, rows) {
  var csv = [headers].concat(rows).map(function (row) {
    return row.map(csvCell).join(',');
  }).join('\r\n');
  var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.href = url;
  link.download = filename;
  link.target = '_top';
  document.body.appendChild(link);
  link.click();
  link.remove();
  window.setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}
function printSheet(target, title) {
  var className = 'printing-' + target;
  var previousTitle = document.title;
  document.title = title;
  document.body.classList.add(className);
  var cleanup = function () {
    document.body.classList.remove(className);
    document.title = previousTitle;
  };
  window.addEventListener('afterprint', cleanup, { once: true });
  window.setTimeout(function () { window.print(); }, 40);
}

/* ============================= boot ============================= */

function boot() {
  if (A.seal) {
    var img = document.getElementById('boot-seal');
    if (img) img.src = A.seal;
  }
  S.token = '';
  try { S.token = localStorage.getItem('fdr_token') || ''; } catch (e) {}
  if (S.token) {
    api('me', { token: S.token }).then(function (user) {
      if (user) {
        S.user = user;
        return loadState();
      }
    }).catch(function () {}).then(function () {
      S.boot = false;
      render();
    });
  } else {
    S.boot = false;
    render();
  }
}

function viewFinancial() {

function cashVarianceHtml() {
  var fin = S.ui.fin;
  var variance = Number(fin.actual) - Number(fin.expected);
  var negative = variance < 0;
  return '<div class="panel calculator-panel">' +
    panelHeading('banknote', L('ពិនិត្យភាពខុសគ្នាសាច់ប្រាក់', 'Cash variance check')) +
    '<div class="form-grid three">' +
      field(L('សាច់ប្រាក់រំពឹង', 'Expected cash'), '<input type="number" data-bind="fin.expected" data-live="cash" value="' + esc(fin.expected) + '">') +
      field(L('សាច់ប្រាក់ជាក់ស្តែង', 'Actual cash'), '<input type="number" data-bind="fin.actual" data-live="cash" value="' + esc(fin.actual) + '">') +
      field(L('ភាពខុសគ្នា', 'Variance'), '<div class="' + cn('variance-value', negative ? 'negative' : 'positive') + '" id="cash-variance">' + (negative ? '−' : '+') + '$' + Math.abs(variance).toFixed(2) + '</div>') +
    '</div>' +
    '<div class="' + cn('variance-result', negative ? 'negative' : 'positive') + '" id="cash-result">' + icon('alert-triangle', 18) +
      '<div><strong>' + (negative ? L('ត្រូវការពិនិត្យបន្ថែម', 'Needs review') : L('សាច់ប្រាក់ត្រូវគ្នា', 'Cash is balanced')) + '</strong>' +
      '<span>' + (negative ? L('កត់ត្រាមូលហេតុ មុនពេលបិទវេន។', 'Record the reason before closing the shift.') : L('មិនមានភាពខុសគ្នាដែលត្រូវដោះស្រាយទេ។', 'No exception needs resolution.')) + '</span></div></div></div>';
}

function deepCalcHtml(entries) {
  var gross = entries.filter(function (e) { return e.type === 'income'; }).reduce(function (s, e) { return s + e.amount; }, 0);
  var adjustments = entries.filter(function (e) { return e.type !== 'income'; }).reduce(function (s, e) { return s + e.amount; }, 0);
  var net = gross - adjustments;
  return '<div class="panel calculator-panel">' +
    panelHeading('bar-chart-3', L('សេចក្តីសង្ខេបគណនាស៊ីជម្រៅ', 'Deep calculation summary')) +
    '<div class="calc-metrics">' +
      '<div><span>Gross revenue</span><strong>' + formatMoney(gross) + '</strong><small>' + L('ចំណូលកត់ត្រាក្នុងបញ្ជី', 'Recorded income entries') + '</small></div>' +
      '<div><span>Net revenue</span><strong>' + formatMoney(net) + '</strong><small>' + L('បន្ទាប់ពីចំណាយ និងសងប្រាក់', 'After expenses & refunds') + '</small></div>' +
      '<div><span>Adjustments</span><strong>' + formatMoney(adjustments) + '</strong><small>' + L('ចំណាយ និងការសងប្រាក់', 'Expenses + refunds recorded') + '</small></div>' +
    '</div></div>';
}

function viewMonthly() {
  var tt = t();
  var month = S.ui.monthly.month;
  var monthReports = S.data.reports.filter(function (report) { return report.status !== 'Draft' && report.dateIso.slice(0, 7) === month; });
  var avgOccupancy = monthReports.length ? Math.round(monthReports.reduce(function (sum, r) { return sum + parseInt(r.occupancy, 10); }, 0) / monthReports.length) : 0;
  var grossIncome = monthReports.reduce(function (sum, r) { return sum + (r.incomeAmount || 0); }, 0);
  var parts = month.split('-');
  var year = Number(parts[0]) || new Date().getFullYear();
  var monthIndex = Number(parts[1]) || 1;
  var daysInMonth = new Date(year, monthIndex, 0).getDate();
  var perDay = {};
  monthReports.forEach(function (report) {
    var day = Number(report.dateIso.slice(8, 10));
    (perDay[day] = perDay[day] || []).push(parseInt(report.occupancy, 10));
  });
  var pointDays = Object.keys(perDay).map(Number).sort(function (a, b) { return a - b; });
  var points = pointDays.map(function (day) {
    var values = perDay[day];
    return { day: day, pct: Math.round(values.reduce(function (s, v) { return s + v; }, 0) / values.length) };
  });
  var coverage = Math.min(100, Math.round((pointDays.length / daysInMonth) * 100));
  var withNotes = monthReports.filter(function (r) { return r.notes; }).length;
  var noteShare = monthReports.length ? Math.round((withNotes / monthReports.length) * 100) : 0;
  var nightShare = monthReports.length ? Math.round((monthReports.filter(function (r) { return r.shift === 'Night'; }).length / monthReports.length) * 100) : 0;
  var dots = points.map(function (point) {
    return '<span style="left:' + (4 + ((point.day - 1) / Math.max(1, daysInMonth - 1)) * 84) + '%;top:' + (88 - point.pct * 0.78) + '%"></span>';
  }).join('');
  return '<div class="section-stack">' +
    sectionHeader('FDR / MONTHLY PULSE', tt.pageMonthly, L('ទិដ្ឋភាពប្រចាំខែពីរបាយការណ៍វេនពិតៗ។', 'A monthly view computed from real submitted reports.'),
      '<div class="toolbar-actions"><input class="compact-input" type="month" data-bind="monthly.month" data-change="monthly" value="' + esc(month) + '">' +
      '<button class="secondary-button" data-action="month-csv" ' + (!monthReports.length ? 'disabled' : '') + '>' + icon('download', 15) + 'Export</button></div>') +
    '<div class="report-metric-grid">' +
      metricBlock('Occupancy', avgOccupancy + '%', monthReports.length + ' reports') +
      metricBlock('Gross income', formatMoney(grossIncome), L('ពីរបាយការណ៍', 'from reports')) +
      metricBlock('Days covered', pointDays.length + ' / ' + daysInMonth, coverage + '%') +
      metricBlock('Notes filed', noteShare + '%', withNotes + ' ' + L('របាយការណ៍', 'reports')) +
    '</div>' +
    '<div class="content-grid two-column"><div class="panel">' +
      panelHeading('bar-chart-3', L('អត្រាកាន់កាប់ប្រចាំខែ', 'Monthly occupancy')) +
      '<div class="line-chart"><div class="line-chart-path">' + dots + '</div>' +
      '<div class="line-labels"><span>01</span><span>' + pad2(Math.min(7, daysInMonth)) + '</span><span>' + pad2(Math.min(14, daysInMonth)) + '</span><span>' + pad2(Math.min(21, daysInMonth)) + '</span><span>' + pad2(daysInMonth) + '</span></div></div>' +
    '</div><div class="panel">' +
      panelHeading('clipboard-check', L('គុណភាពប្រគល់វេន', 'Handover quality')) +
      '<div class="quality-list">' +
        qualityRow(L('ថ្ងៃមានរបាយការណ៍', 'Days with reports'), coverage + '%') +
        qualityRow(L('របាយការណ៍មានកំណត់ចំណាំ', 'Reports with notes'), noteShare + '%') +
        qualityRow(L('របាយការណ៍វេនយប់', 'Night audits filed'), nightShare + '%') +
      '</div>' +
    '</div></div></div>';
}

/* ============================= render + events ============================= */

function render() {
  var root = document.getElementById('root');
  document.documentElement.lang = S.lang === 'km' ? 'km' : 'en';
  var html;
  if (S.boot) {
    html = '<div class="app-boot"><img src="' + (A.seal || '') + '" alt=""><span class="app-boot-word">FDR</span></div>';
  } else if (!S.user) {
    html = S.registering ? registerHtml() : loginHtml();
  } else {
    html = appHtml();
  }
  root.innerHTML = html;
  bindForms();
}

function bindForms() {
  var root = document.getElementById('root');
  var login = document.getElementById('login-form');
  if (login) {
    login.addEventListener('submit', function (event) {
      event.preventDefault();
      var email = (document.getElementById('login-email').value || '').trim().toLowerCase();
      var password = document.getElementById('login-password').value || '';
      var shiftSel = document.getElementById('login-shift');
      S.shift = shiftSel ? shiftSel.value : 'Morning';
      S.busy = true;
      render();
      doLogin(email, password).catch(function () {
        S.busy = false;
        render();
      });
    });
  }
  var register = document.getElementById('register-form');
  if (register) {
    register.addEventListener('submit', function (event) {
      event.preventDefault();
      // read values BEFORE render() — the re-render replaces the DOM
      var payload = {
        name: (document.getElementById('reg-name').value || '').trim(),
        email: (document.getElementById('reg-email').value || '').trim(),
        password: document.getElementById('reg-password').value || '',
        department: (document.getElementById('reg-department').value || 'Front office'),
        shift: (document.getElementById('reg-shift').value || 'Morning')
      };
      S.busy = true;
      render();
      doRegister(payload).catch(function () {
        S.busy = false;
        render();
      });
    });
  }
  var report = document.getElementById('report-form');
  if (report) {
    report.addEventListener('submit', function (event) {
      event.preventDefault();
      submitReport('submitted');
    });
  }
}

function setUi(path, value) {
  var parts = path.split('.');
  var target = S.ui[parts[0]];
  target[parts[1]] = value;
}

function liveUpdate(kind) {
  if (kind === 'report') {
    var u = S.ui.report;
    var pct = u.total ? Math.min(100, Math.round((u.occupied / u.total) * 100)) : 0;
    var pctEl = document.getElementById('report-pct');
    if (pctEl) pctEl.textContent = pct + '%';
    var bar = document.getElementById('report-progress-bar');
    if (bar) bar.style.width = pct + '%';
  } else if (kind === 'cash') {
    var fin = S.ui.fin;
    var variance = Number(fin.actual) - Number(fin.expected);
    var negative = variance < 0;
    var valEl = document.getElementById('cash-variance');
    if (valEl) {
      valEl.textContent = (negative ? '−' : '+') + '$' + Math.abs(variance).toFixed(2);
      valEl.className = 'variance-value ' + (negative ? 'negative' : 'positive');
    }
    var resEl = document.getElementById('cash-result');
    if (resEl) {
      resEl.className = 'variance-result ' + (negative ? 'negative' : 'positive');
      var strong = resEl.querySelector('strong');
      var span = resEl.querySelector('div > span');
      if (strong) strong.textContent = negative ? L('ត្រូវការពិនិត្យបន្ថែម', 'Needs review') : L('សាច់ប្រាក់ត្រូវគ្នា', 'Cash is balanced');
      if (span) span.textContent = negative ? L('កត់ត្រាមូលហេតុ មុនពេលបិទវេន។', 'Record the reason before closing the shift.') : L('មិនមានភាពខុសគ្នាដែលត្រូវដោះស្រាយទេ។', 'No exception needs resolution.');
    }
  } else if (kind === 'tracking') {
    var fin2 = S.ui.fin;
    var expected = Number(fin2.opening) + Number(fin2.sales) - Number(fin2.refunds);
    var el = document.getElementById('tracking-close');
    if (el) el.textContent = '$' + expected.toFixed(2);
  } else if (kind === 'closeout') {
    var el2 = document.getElementById('closeout-afternoon-open');
    if (el2) el2.textContent = '$' + (Number(S.ui.close.morningClose) || 0).toFixed(2);
  } else if (kind === 'history') {
    var wrap = document.getElementById('history-table');
    if (wrap) wrap.innerHTML = buildHistoryTable();
  }
}

function buildHistoryTable() {
  var tt = t();
  var query = S.ui.history.query.trim().toLowerCase();
  var filtered = S.data.reports.filter(function (report) {
    return !query || report.id.toLowerCase().indexOf(query) !== -1 || report.reporter.toLowerCase().indexOf(query) !== -1;
  });
  var rows = filtered.map(function (report) {
    return [report.id, formatDate(new Date(report.dateIso + 'T00:00:00'), S.lang), report.shift, report.reporter, 'Front office', pill(report.status),
      '<button class="text-button">' + L('បើក', 'Open') + ' ' + icon('arrow-up-right', 13) + '</button>'];
  });
  return dataTable(['Report ID', tt.date, tt.shift, tt.reporter, 'Department', tt.status, ''], rows);
}

var rootClick = function (event) {
  var target = event.target;
  var actionEl = target.closest('[data-action]');
  if (actionEl) {
    var action = actionEl.getAttribute('data-action');
    handleAction(action, actionEl);
    return;
  }
  // clicking the modal backdrop (not the sheet) closes the modal
  if (S.ui.taskModal || S.ui.inquiryModal || S.ui.financeModal) {
    var backdrop = target.closest('[data-close-on-backdrop]');
    if (backdrop && target === backdrop) {
      S.ui.taskModal = null;
      S.ui.inquiryModal = null;
      S.ui.financeModal = null;
      render();
      return;
    }
  }
  // click outside a popover closes it
  if (S.ui.notifOpen && !target.closest('.notification-wrap')) {
    S.ui.notifOpen = false;
    render();
  }
};

function handleAction(action, el) {
  var a = el.getAttribute('data-view');
  switch (action) {
    case 'nav':
      S.view = a;
      S.ui.mobileNavOpen = false;
      S.ui.notifOpen = false;
      render();
      break;
    case 'toggle-lang':
      S.lang = S.lang === 'km' ? 'en' : 'km';
      render();
      break;
    case 'toggle-sidebar':
      S.ui.sidebarCollapsed = !S.ui.sidebarCollapsed;
      render();
      break;
    case 'toggle-mobile':
      S.ui.mobileNavOpen = !S.ui.mobileNavOpen;
      render();
      break;
    case 'notif':
      S.ui.notifOpen = !S.ui.notifOpen;
      if (S.ui.notifOpen) S.ui.notifCount = 0;
      render();
      break;
    case 'refresh':
      doRefresh();
      break;
    case 'logout':
      doLogout();
      break;
    case 'open-register':
      S.registering = true;
      render();
      break;
    case 'close-register':
      S.registering = false;
      render();
      break;
    case 'select-day':
      S.ui.selectedDay = Number(el.getAttribute('data-day'));
      render();
      break;
    case 'report-draft':
      submitReport('draft');
      break;
    case 'shift-gen':
      S.ui.shifts.generated = true;
      render();
      break;
    case 'shift-csv':
      exportShiftCsv();
      break;
    case 'handover-print':
      printSheet('handover', 'FDR Shift Handover ' + S.ui.shifts.date);
      break;
    case 'task-status':
      (function (id, status) {
        mutate(function () { return api('setTaskStatus', { token: S.token, id: id, status: status }); })
          .then(function () { toastSuccess(L('ស្ថានភាពភារកិច្ចបានធ្វើបច្ចុប្បន្នភាព', 'Task status updated')); })
          .catch(function (e) { toastError(errText(e)); });
      })(el.getAttribute('data-id'), el.getAttribute('data-status'));
      break;
    case 'open-task-modal':
      S.ui.taskModal = { title: '', priority: 'Med', due: '12:00' };
      render();
      break;
    case 'open-inquiry-modal':
      S.ui.inquiryModal = { channel: 'Front desk', category: 'Room info', guestName: '', details: '', outcome: 'follow_up', followUp: '' };
      render();
      break;
    case 'open-finance-modal':
      S.ui.financeModal = { type: el.getAttribute('data-type'), dateIso: todayIso(), shift: S.shift, category: '', description: '', amount: '' };
      render();
      break;
    case 'close-modal':
      S.ui.taskModal = null;
      S.ui.inquiryModal = null;
      S.ui.financeModal = null;
      render();
      break;
    case 'task-add':
      (function (modal) {
        mutate(function () {
          return api('addTask', { token: S.token, title: modal.title.trim(), detail: S.lang === 'km' ? 'បានបន្ថែមពីផ្ទាំងគ្រប់គ្រង' : 'Added from dashboard', priority: modal.priority, due: modal.due });
        }).then(function () {
          S.ui.taskModal = null;
          render();
          toastSuccess(L('បានបន្ថែមភារកិច្ចថ្មី', 'New task added'));
        }).catch(function (e) {
          S.ui.taskModal = null;
          render();
          toastError(errText(e));
        });
      })(S.ui.taskModal);
      break;
    case 'inquiry-add':
      (function (modal) {
        mutate(function () {
          return api('addInquiry', {
            token: S.token, channel: modal.channel, category: modal.category,
            guestName: modal.guestName.trim(), details: modal.details.trim(),
            outcome: modal.outcome, followUp: modal.followUp.trim()
          });
        }).then(function () {
          S.ui.inquiryModal = null;
          render();
          toastSuccess(L('សំណួរត្រូវបានកត់ត្រា', 'Inquiry logged'));
        }).catch(function (e) {
          S.ui.inquiryModal = null;
          render();
          toastError(errText(e));
        });
      })(S.ui.inquiryModal);
      break;
    case 'finance-add':
      (function (modal) {
        mutate(function () {
          return api('addFinance', {
            token: S.token, type: modal.type, dateIso: modal.dateIso, shift: modal.shift,
            category: modal.category.trim(), description: modal.description.trim(), amount: Number(modal.amount)
          });
        }).then(function () {
          S.ui.financeModal = null;
          render();
          toastSuccess(L('ប្រតិបត្តិការត្រូវបានកត់ត្រា', 'Ledger entry saved'));
        }).catch(function (e) {
          S.ui.financeModal = null;
          render();
          toastError(errText(e));
        });
      })(S.ui.financeModal);
      break;
    case 'fin-tab':
      S.ui.fin.tab = el.getAttribute('data-tab');
      render();
      break;
    case 'fin-csv':
      exportFinanceCsv();
      break;
    case 'cash-log-save':
      toastSuccess(L('បានរក្សាទុកកំណត់ហេតុ', 'Cash log saved'));
      break;
    case 'close-csv':
      (function (c) {
        downloadCsv('fdr-daily-closeout-2026-08-30.csv',
          ['Date', 'Shift', 'Staff', 'Opening float USD', 'Closing float USD', 'Handover note'],
          [
            ['30 Aug 2026', 'Morning', 'John Doe', '200', String(c.morningClose), 'Pending tasks recorded'],
            ['30 Aug 2026', 'Afternoon', 'Dara Lim', String(c.morningClose), '1080', 'Linked from morning'],
            ['30 Aug 2026', 'Night', 'Nary Chann', '1080', '720', 'End-of-day summary recorded']
          ]);
        toastSuccess(L('ឯកសារ CSV បានទាញយក', 'Closeout CSV downloaded'));
      })(S.ui.close);
      break;
    case 'close-print':
      printSheet('closeout', 'FDR Daily Closeout');
      break;
    case 'close-save':
      S.ui.close.saved = true;
      render();
      toastSuccess(t().saved);
      break;
    case 'fb-save':
      (function (f) {
        mutate(function () {
          return api('addFeedback', {
            token: S.token, dateIso: f.dateIso, channel: f.channel,
            guestName: f.guestName.trim(), room: f.room.trim(), comment: f.comment.trim()
          });
        }).then(function () {
          S.ui.fb.comment = '';
          S.ui.fb.guestName = '';
          S.ui.fb.room = '';
          S.ui.fb.saved = true;
          render();
          window.setTimeout(function () { S.ui.fb.saved = false; render(); }, 2600);
          toastSuccess(L('មតិភ្ញៀវត្រូវបានរក្សាទុក', 'Guest feedback saved'));
        }).catch(function (e) { toastError(errText(e)); });
      })(S.ui.fb);
      break;
    case 'month-csv':
      exportMonthlyCsv();
      break;
    case 'year-csv':
      exportYearCsv();
      break;
    case 'shift-add':
      toastInfo(L('ទម្រង់បន្ថែមវេនបានបើក', 'Shift form ready'));
      break;
    case 'admin-section':
      S.ui.admin.section = el.getAttribute('data-section');
      render();
      break;
    case 'user-status':
      (function (id, status) {
        mutate(function () { return api('setUserStatus', { token: S.token, id: id, status: status }); })
          .then(function () {
            toastSuccess(status === 'active' ? L('គណនីត្រូវបានអនុម័ត', 'Account approved') : L('គណនីត្រូវបានបដិសេធ', 'Account rejected'));
          })
          .catch(function (e) { toastError(errText(e)); });
      })(el.getAttribute('data-id'), el.getAttribute('data-status'));
      break;
  }
}

function submitReport(status) {
  var input = collectReport();
  input.status = status;
  input.token = S.token;
  mutate(function () { return api('submitReport', input); }).then(function (result) {
    if (status === 'draft') {
      toastSuccess(t().saved);
    } else {
      toastSuccess(t().submitted + (result && result.id ? ' · ' + result.id : ''));
      S.view = 'shiftreports';
      S.ui.shifts.date = input.dateIso;
      S.ui.shifts.generated = true;
      render();
    }
  }).catch(function (e) { toastError(errText(e)); });
}

var rootInput = function (event) {
  var target = event.target;
  var bound = target.closest('[data-bind]');
  if (!bound) return;
  var path = bound.getAttribute('data-bind');
  var value = bound.type === 'checkbox' ? bound.checked : bound.value;
  setUi(path, value);
  var live = bound.getAttribute('data-live');
  if (live) liveUpdate(live);
  syncModalButtons();
};

var rootChange = function (event) {
  var target = event.target;
  var bound = target.closest('[data-bind]');
  if (bound) {
    var path = bound.getAttribute('data-bind');
    var value = bound.type === 'checkbox' ? bound.checked : bound.value;
    setUi(path, value);
    var changeKind = bound.getAttribute('data-change');
    if (changeKind) {
      if (changeKind === 'shifts-date') S.ui.shifts.generated = false;
      render();
    } else if (bound.closest('.auth-form') || bound.closest('.form-sheet')) {
      // keep text field focus — no re-render on plain change
    }
    if (bound.id === 'login-shift' || bound.id === 'login-email' || bound.id === 'login-password') return;
  }
  if (target.getAttribute && target.getAttribute('data-action') === 'shift-select') {
    S.shift = target.value;
    render();
  }
  // modal validation buttons enable/disable
  if (S.ui.taskModal || S.ui.inquiryModal || S.ui.financeModal) {
    syncModalButtons();
  }
};

function syncModalButtons() {
  var root = document.getElementById('root');
  var taskBtn = root.querySelector('[data-action="task-add"]');
  if (taskBtn && S.ui.taskModal) taskBtn.disabled = S.busy || !S.ui.taskModal.title.trim();
  var inqBtn = root.querySelector('[data-action="inquiry-add"]');
  if (inqBtn && S.ui.inquiryModal) inqBtn.disabled = S.busy || !S.ui.inquiryModal.details.trim();
  var finBtn = root.querySelector('[data-action="finance-add"]');
  if (finBtn && S.ui.financeModal) {
    var parsed = Number(S.ui.financeModal.amount);
    finBtn.disabled = S.busy || !S.ui.financeModal.category.trim() || !isFinite(parsed) || parsed <= 0;
  }
  // feedback save button (lives in the view, not a modal)
  var fbBtn = root.querySelector('[data-action="fb-save"]');
  if (fbBtn) fbBtn.disabled = !String(S.ui.fb.comment || '').trim();
}

function init() {
  var root = document.getElementById('root');
  root.addEventListener('click', rootClick);
  root.addEventListener('input', rootInput);
  root.addEventListener('change', rootChange);
  boot();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
</body>
</html>
